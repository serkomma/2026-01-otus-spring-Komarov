spring:
  datasource:
    url: jdbc:h2:mem:maindb
#    initialization-mode: always
#    schema: schema.sql
#    data: data.sql
  sql:
    init:
      mode: always
      data-locations: data.sql
      schema-locations: schema.sql

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true

  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true